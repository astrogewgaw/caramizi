[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "caramizi"
version = "0.1.0"
readme = "README.md"
dependencies = ["numpy"]
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Ujjwal Panda", email = "ujjwapanda97@gmail.com" }]
description = "Fast bricks for building fast transient analysis software."

classifiers = [
  "Operating System :: Unix",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.urls]
Source = "https://github.com/astrogewgaw/caramizi"
Homepage = "https://github.com/astrogewgaw/caramizi"
Documentation = "https://astrogewgaw.github.io/caramizi"
Issues = "https://github.com/astrogewgaw/caramizi/issues"

[tool.scikit-build]
wheel.py-api = "cp312"          # Build stable ABI wheels for CPython 3.12+
minimum-version = "0.4"         # Protect the configuration against future changes in scikit-build-core
build-dir = "build/{wheel_tag}" # Setuptools-style build caching in a local directory
